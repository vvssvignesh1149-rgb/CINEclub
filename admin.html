<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CINENET - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="container">
    <h2>CINENET Admin Portal</h2>

    <!-- Secret Pin Lock -->
    <div id="adminLoginBox" class="auth-card">
        <h3>Security Verification</h3>
        <input type="password" id="adminSecretPin" placeholder="Enter Secret PIN">
        <button onclick="verifyAdmin()" class="primary-btn" style="margin-top: 10px;">Unlock Panel</button>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" style="display:none;">
        <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
            <button onclick="loadUserTable()" class="primary-btn">Manage Users & Teams</button>
            <button onclick="loadAwardManager('filmmaker')" class="primary-btn" style="background:#ffcc00; color:#000;">Set Best Filmmaker</button>
            <button onclick="loadAwardManager('photographer')" class="primary-btn" style="background:#ffcc00; color:#000;">Set Best Photographer</button>
            <button onclick="loadAwardManager('editor')" class="primary-btn" style="background:#ffcc00; color:#000;">Set Best Editor</button>
        </div>
        <div style="margin-top: 30px;" id="adminDataDisplay"></div>
    </div>

    <script>
        const SECRET_PIN = "CINEMA2026";
        let db;
        const dbRequest = indexedDB.open("CinenetMediaDB", 1);

        dbRequest.onerror = function(event) {
            console.error("IndexedDB error: " + event.target.errorCode);
        };

        dbRequest.onsuccess = function(event) {
            db = event.target.result;
        };

        dbRequest.onupgradeneeded = function(event) {
            db = event.target.result;
            if (!db.objectStoreNames.contains("mediaStore")) {
                db.createObjectStore("mediaStore", { keyPath: "id", autoIncrement: true });
            }
        };

        function verifyAdmin() {
            const entered = document.getElementById('adminSecretPin').value;
            if(entered === SECRET_PIN) {
                document.getElementById('adminLoginBox').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadUserTable();
            } else {
                alert('Incorrect Secret PIN!');
            }
        }

        function loadUserTable() {
            let users = JSON.parse(localStorage.getItem('cinenet_users')) || [];
            let html = `<h3>Registered Users & Team Management</h3>
                        <table border="1" style="width:100%; border-collapse:collapse; margin-top:15px; background:#181818; color:#fff;">
                            <tr style="background:#e50914;">
                                <th style="padding:10px;">Name</th>
                                <th>Roll No</th>
                                <th>Branch</th>
                                <th>Year</th>
                                <th>Assigned Team</th>
                                <th>Action</th>
                            </tr>`;
            
            if(users.length === 0) {
                html += `<tr><td colspan="6" style="text-align:center; padding:15px;">No users registered yet.</td></tr>`;
            } else {
                users.forEach(u => {
                    html += `<tr>
                        <td style="padding:8px;">${u.name}</td>
                        <td>${u.roll}</td>
                        <td>${u.branch}</td>
                        <td>${u.year}</td>
                        <td>${u.team || 'None'}</td>
                        <td style="padding:8px; text-align:center;">
                            ${u.team ? `<button onclick="adminRemoveTeam('${u.roll}')" style="background:#d9534f; color:#fff; border:none; padding:5px 10px; border-radius:3px; cursor:pointer;">Remove from Team</button>` : 'No Team'}
                        </td>
                    </tr>`;
                });
            }
            html += `</table>`;
            document.getElementById('adminDataDisplay').innerHTML = html;
        }

        function adminRemoveTeam(rollNo) {
            let users = JSON.parse(localStorage.getItem('cinenet_users')) || [];
            users = users.map(u => {
                if(u.roll === rollNo) {
                    u.team = null;
                }
                return u;
            });
            localStorage.setItem('cinenet_users', JSON.stringify(users));

            let currentUser = JSON.parse(localStorage.getItem('cinenet_current_user'));
            if(currentUser && currentUser.roll === rollNo) {
                currentUser.team = null;
                localStorage.setItem('cinenet_current_user', JSON.stringify(currentUser));
            }

            alert('User successfully removed from the team by Admin!');
            loadUserTable();
        }

        // Award Manager for 3 Categories
        function loadAwardManager(category) {
            if (!db) {
                alert("Database loading... Please try again.");
                return;
            }
            let transaction = db.transaction(["mediaStore"], "readonly");
            let store = transaction.objectStore("mediaStore");
            let request = store.getAll();

            request.onsuccess = function() {
                let allContent = request.result || [];
                let filteredItems = [];

                let titleText = "";
                if(category === 'filmmaker') {
                    filteredItems = allContent.filter(c => c.type === 'Short Film');
                    titleText = "Choose Best Filmmaker (Short Films)";
                } else if(category === 'photographer') {
                    filteredItems = allContent.filter(c => c.type === 'Photograph');
                    titleText = "Choose Best Photographer (Photographs)";
                } else if(category === 'editor') {
                    filteredItems = allContent.filter(c => c.type === 'Edit');
                    titleText = "Choose Best Editor (Edits)";
                }

                let html = `<h3>${titleText}</h3>
                            <p style="color:#aaa; margin-bottom:15px;">Select submission to feature on Home Page:</p>`;
                
                if(filteredItems.length === 0) {
                    html += `<p style="color:#888;">No submissions found for this category yet.</p>`;
                } else {
                    html += `<div style="display:flex; flex-direction:column; gap:15px;">`;
                    filteredItems.forEach(item => {
                        html += `
                            <div style="background:#181818; border:1px solid #333; padding:15px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                                <div>
                                    <h4 style="color:#ffcc00;">${item.title}</h4>
                                    <p style="font-size:13px; color:#aaa;">By: ${item.uploader} | Team: ${item.team}</p>
                                </div>
                                <button onclick="setAwardWinner('${category}', ${item.id})" class="primary-btn" style="background:#28a745; cursor:pointer;">Set Winner</button>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
                document.getElementById('adminDataDisplay').innerHTML = html;
            };
        }

        function setAwardWinner(category, mediaId) {
            if (!db) return;
            let transaction = db.transaction(["mediaStore"], "readonly");
            let store = transaction.objectStore("mediaStore");
            let request = store.get(Number(mediaId));

            request.onsuccess = function() {
                let selectedMedia = request.result;
                if(selectedMedia) {
                    localStorage.setItem(`cinenet_best_${category}`, JSON.stringify(selectedMedia));
                    alert(`Successfully updated! ${selectedMedia.uploader} (${selectedMedia.team}) is set as Best ${category.charAt(0).toUpperCase() + category.slice_q || category}.`);
                } else {
                    alert('Error: Record not found.');
                }
            };
        }
    </script>
</body>
</html>
