<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CINENET - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="text-align:center; margin-top: 100px;">
        <h2>Admin Portal</h2>
        <div id="loginBox">
            <input type="password" id="adminPin" placeholder="Enter Secret PIN">
            <button onclick="checkAdmin()">Login</button>
        </div>
        <div id="adminDashboard" style="display:none;">
            <h3>Registered Users Data</h3>
            <div id="userDataList"></div>
        </div>
    </div>
    <script>
        function checkAdmin() {
            const secret = "CINEMA2026"; // Mee secret lock
            const entered = document.getElementById("adminPin").value;
            if(entered === secret) {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("adminDashboard").style.display = "block";
                // Fetch data logic here
            } else {
                alert("Wrong Secret PIN!");
            }
        }
    </script>
</body>
</html>
